# this file is here to facilitate development/testing
# $ docker compose up -d --build --force-recreate

version: "3.8"

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password

  backup:
    build:
      context: .
      args:
        ALPINE_VERSION: "3.16"
    environment:
      SCHEDULE: "@weekly" # optional
      BACKUP_KEEP_DAYS: 7 # optional
      #PASSPHRASE: passphrase # optional
      S3_REGION:
      S3_BUCKET:
      S3_PREFIX: backup
      S3_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
      - aws_access_key_id
      - aws_secret_access_key

secrets:
  aws_access_key_id:
    file: secrets/aws_access_key_id.txt
  aws_secret_access_key:
    file: secrets/aws_secret_access_key.txt
  postgres_user:
    file: secrets/postgres_user.txt
  postgres_password:
    file: secrets/postgres_password.txt
